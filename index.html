<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EvilPopCorn Banner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    background:transparent;
}

.banner{
    width:1080px;
    height:320px;
    position:relative;
    overflow:hidden;

    background:#00FF00;
}

/* ---------- LEFT ---------- */

.left{

    position:absolute;

    left:40px;
    bottom:0;

    height:320px;

    animation:leftScene 12s infinite;
}

.left img{

    height:100%;
    display:block;
}

/* ---------- RIGHT ---------- */

.right{

    position:absolute;

    right:30px;
    bottom:0;

    height:320px;

    opacity:0;

    animation:rightScene 12s infinite;
}

.right img{

    height:100%;
    display:block;
}

/* ---------- TWITCH ---------- */

.platform{

    position:absolute;

    left:180px;
    bottom:20px;

    width:620px;

    opacity:0;

    animation:rightScene 12s infinite;
}

.platform img{

    width:100%;
    display:block;
}

/* ---------- CENTER ---------- */

.center{

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    height:320px;

    opacity:0;

    animation:centerScene 12s infinite;
}

.center img{

    height:100%;
    display:block;
}

/* ---------- ANIMATIONS ---------- */

@keyframes leftScene{

0%{
opacity:0;
transform:translateX(-40px);
}

6%{
opacity:1;
transform:translateX(0);
}

28%{
opacity:1;
}

35%{
opacity:0;
transform:translateX(-20px);
}

100%{
opacity:0;
}

}

@keyframes rightScene{

0%,35%{
opacity:0;
}

42%{
opacity:1;
}

65%{
opacity:1;
}

72%{
opacity:0;
}

100%{
opacity:0;
}

}

@keyframes centerScene{

0%,72%{
opacity:0;
transform:translateX(-50%) scale(.95);
}

80%{
opacity:1;
transform:translateX(-50%) scale(1);
}

95%{
opacity:1;
}

100%{
opacity:0;
transform:translateX(-50%) scale(.95);
}

}

</style>

</head>

<body>

<div class="banner">

    <div class="left">
        <img src="left.png">
    </div>

    <div class="right">
        <img src="right.png">
    </div>

    <div class="platform">
        <img src="banner.png">
    </div>

    <div class="center">
        <img src="center.png">
    </div>

</div>

</body>
</html>
